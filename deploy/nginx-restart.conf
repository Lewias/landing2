# Optional hardening: make systemd bring nginx back if it ever dies.
#
# The stock nginx unit on Debian/Ubuntu does not always set Restart=, so a
# crash can leave the site down until someone notices. Install with:
#
#   sudo systemctl edit nginx
#
# and paste the two lines below, or drop this file in directly:
#
#   sudo mkdir -p /etc/systemd/system/nginx.service.d
#   sudo cp deploy/nginx-restart.conf /etc/systemd/system/nginx.service.d/override.conf
#   sudo systemctl daemon-reload && sudo systemctl restart nginx

[Service]
Restart=on-failure
RestartSec=3s
