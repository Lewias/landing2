# Location blocks for serving the built site as static files.
#
# Meant to be pulled into an EXISTING server block — the one certbot already
# manages for your domain — so the TLS lines stay untouched. Inside that block:
#
#     root  /var/www/landing2/dist;
#     index index.html;
#     include /var/www/landing2/deploy/static-locations.conf;
#
# and delete the old `location / { proxy_pass http://127.0.0.1:3000; }`.
#
# Do not put `root` here: it belongs in the server block so one line controls
# the path.

# Asset filenames carry a content hash, so a cached copy can never be stale.
location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
}

# Media keeps the same filename across builds, so let the browser revalidate.
location ~* \.(mp4|webp|jpg|jpeg|png|svg|ico)$ {
    expires 7d;
    add_header Cache-Control "public";
    add_header Accept-Ranges bytes;
    access_log off;
}

# index.html must never be cached, or a deploy never reaches anyone.
location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate";
}

location / {
    try_files $uri $uri/ /index.html;
}
